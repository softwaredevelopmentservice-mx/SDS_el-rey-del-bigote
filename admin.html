<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel El Rey del Bigote</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E0F12">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

  <!-- Entrada con PIN -->
  <main class="login" id="login">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-stripes" aria-hidden="true"></div>
      <img class="login-logo" src="assets/logo.svg" alt="" width="96" height="77">
      <h1>Panel del barbero</h1>
      <p class="login-sub">Escribe tu PIN para ver tus citas.</p>
      <label class="field">
        <span>PIN</span>
        <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="••••••" required>
      </label>
      <p class="err" id="pinErr" role="alert"></p>
      <button type="submit" class="btn btn-red btn-lg" id="loginBtn">Entrar</button>
      <p class="demo-hint" id="demoHint" hidden>Modo demo con citas de ejemplo. PIN: <strong>1234</strong></p>
    </form>
  </main>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="nav">
      <div class="nav-in">
        <span class="brand"><img src="assets/logo.svg" alt="" width="44" height="35"><span>El Rey del Bigote</span></span>
        <span class="admin-tag">Panel</span>
        <div class="nav-actions">
          <button type="button" class="icon-btn" id="refresh" aria-label="Actualizar citas" title="Actualizar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button type="button" class="btn btn-line btn-sm" id="logout">Salir</button>
        </div>
      </div>
    </header>

    <main class="wrap board">
      <section class="hello">
        <h1 class="h2" id="hello">Hola</h1>
        <p class="lead" id="today"></p>
      </section>

      <div class="days" id="days" role="radiogroup" aria-label="Día"></div>

      <section class="stats" aria-label="Resumen del día">
        <div class="stat"><span class="stat-n" id="sCount">0</span><span class="stat-l">citas</span></div>
        <div class="stat"><span class="stat-n" id="sMoney">$0</span><span class="stat-l">por cobrar</span></div>
        <div class="stat stat-next"><span class="stat-n" id="sNext">-</span><span class="stat-l" id="sNextL">siguiente</span></div>
      </section>

      <div class="list-head">
        <h2 id="listTitle">Citas</h2>
        <label class="toggle"><input type="checkbox" id="showCancel"><span class="toggle-ui" aria-hidden="true"></span>Ver canceladas</label>
      </div>
      <p class="sync" id="sync" aria-live="polite"></p>
      <ol class="citas" id="citas"></ol>
    </main>
  </div>

  <!-- Diálogo: cancelar / recorrer -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <button type="button" class="icon-btn sheet-x" id="sheetClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="sheetTitle"></h2>
      <p class="sheet-who" id="sheetWho"></p>

      <!-- recorrer -->
      <div id="moveBox" hidden>
        <p class="q">Nuevo día</p>
        <div class="days" id="moveDays" role="radiogroup" aria-label="Nuevo día"></div>
        <p class="q">Nueva hora</p>
        <div class="slots" id="moveSlots" role="radiogroup" aria-label="Nueva hora"></div>
      </div>

      <label class="field msg-field" id="msgBox">
        <span>Mensaje para el cliente</span>
        <textarea id="msg" rows="4"></textarea>
        <small>Lo puedes editar antes de mandarlo.</small>
      </label>

      <p class="err" id="sheetErr" role="alert"></p>

      <div class="sheet-foot" id="sheetFoot">
        <button type="button" class="btn btn-line" id="sheetNo">No, regresar</button>
        <button type="button" class="btn btn-red" id="sheetYes"></button>
      </div>

      <div class="sheet-done" id="sheetDone" hidden>
        <p class="done-ok" id="doneMsg"></p>
        <a class="btn btn-whats btn-lg" id="sheetWhats" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>
          <span id="sheetWhatsL">Avisar por WhatsApp</span>
        </a>
        <button type="button" class="btn btn-line" id="sheetDoneClose">Listo</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
